AWSTemplateFormatVersion: '2010-09-09'

Description: awsTutorial(Account and user generated content part)
Parameters:
  ResourceNamePrefix:
    Description: Prefix of resource name
    Default: awstutorial
    Type: String
  SteamOAuthPartTemplateUrl:
    Description: Url of the cloud formation template for steam oauth.
    Type: String
    Default: https://aws-plugin-public-resource.s3.ap-northeast-2.amazonaws.com/cloudformation+templates/awsTemplate_SteamOAuth.yaml
  SteamOAuthEC2InstanceType:
    Description: ec2 instance type of the steam oauth server
    Type: String
    Default: t4g.nano
  SteamAPIKey:
    Description: Steam API Key for authentication
    Type: String
  SteamAPPId:
    Description: Steam App ID for authentication
    Type: String
  SteamIdentity:
    Description: Steam Identity for authentication
    Type: String
    Default: 'awsTutorial'
  AuthCodeValidity:
    Description: auth code validity in seconds
    Type: Number
    Default: 300
  DefaultTokenValidity:
    Description: default token validity in seconds
    Type: Number
    Default: 3600
  AccessTokenValidity:
    Description: access token validity in seconds
    Type: Number
    Default: 3600
  RefreshTokenValidity:
    Description: refresh token validity in seconds
    Type: Number
    Default: 2592000
  IdTokenValidity:
    Description: id token validity in seconds
    Type: Number
    Default: 3600
Resources:
  awsTutorialSteamOAuthStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Ref SteamOAuthPartTemplateUrl
      Parameters:
        ResourceNamePrefix: !Ref ResourceNamePrefix
        SteamOAuthEC2InstanceType: !Ref SteamOAuthEC2InstanceType
        SteamAPIKey: !Ref SteamAPIKey
        SteamAPPId: !Ref SteamAPPId
        SteamIdentity: !Ref SteamIdentity
        AuthCodeValidity: !Ref AuthCodeValidity
        DefaultTokenValidity: !Ref DefaultTokenValidity
        AccessTokenValidity: !Ref AccessTokenValidity
        RefreshTokenValidity: !Ref RefreshTokenValidity
        IdTokenValidity: !Ref IdTokenValidity
      Tags:
        -   Key: Usage
            Value: Youtube Streamer
  awsTutorialLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Join
        - ''
        - - !Ref ResourceNamePrefix
          - _UserLogs
      LogGroupClass: INFREQUENT_ACCESS
      RetentionInDays: 7
      Tags:
        - Key: Usage
          Value: Youtube Streamer
  awsTutorialUserGeneratedContentS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Join
        - ''
        - - !Ref ResourceNamePrefix
          - '-ugc-bucket-'
          - !Select
            - 2
            - !Split
              - '/'
              - !Ref AWS::StackId
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Usage
          Value: Youtube Streamer
  awsTutorialCustomAuthLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Join
        - ''
        - - !Ref ResourceNamePrefix
          - _CustomAuth_Lambda_Function_Role
      Description: Role for AWS Lambda Functions Cognito User Pool
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
                - edgelambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: !Join
            - ''
            - - !Ref ResourceNamePrefix
              - Lambda_Functions_Cognito_User_Pool_Log_Policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
        - PolicyName: !Join
            - ''
            - - !Ref ResourceNamePrefix
              - Lambda_Functions_Cognito_User_Pool_CreateUser_Policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminLinkProviderForUser
                Resource: "*"
      Tags:
        - Key: Usage
          Value: Youtube Streamer
  awsTutorialPreSignUp:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Join
        - ''
        - - !Ref ResourceNamePrefix
          - _PreSignUp
      Description: Lambda function for PreSignUp
      Architectures:
        - arm64
      Code:
        ZipFile: |
          def lambda_handler(event, context):
            userName = event['userName']
            triggerSource = event['triggerSource']
          
            print(f'presign: {event}')
          
            if userName.startswith('Steam_') and triggerSource == 'PreSignUp_SignUp':
              raise Exception('Invalid username: Prefix "Steam_" is reserved for Steam authentication')
          
            return event
      Handler: index.lambda_handler
#      LoggingConfig:
#        LogFormat: Text
      MemorySize: 256
      Role: !GetAtt awsTutorialCustomAuthLambdaRole.Arn
      Runtime: python3.12
      Timeout: 30
      Tags:
        -   Key: Usage
            Value: Youtube Streamer
  awsTutorialPreSignUpPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt awsTutorialPreSignUp.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt awsTutorialCognitoUserPool.Arn
  awsTutorialCognitoAuthRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Join
        - ''
        - - !Ref ResourceNamePrefix
          - _Cognito_Auth_Role
      Description: Role for AWS Cognito Identity Auth
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action:
              - sts:AssumeRoleWithWebIdentity
              - sts:TagSession
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref awsTutorialCognitoIdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: authenticated
      Policies:
        - PolicyName: !Join
            - ''
            - - !Ref ResourceNamePrefix
              - _Cognito_Auth_Policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: GameLiftBasic
                Effect: Allow
                Action:
                  # overly permissive
                  - gamelift:StopGameSessionPlacement
                  - gamelift:DescribeGameSessionPlacement
                Resource: '*'
              - Sid: UserGeneratedContent
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:PutObjectTagging
                Resource: !Join
                  - ''
                  - - !GetAtt awsTutorialUserGeneratedContentS3Bucket.Arn
                    - /${cognito-identity.amazonaws.com:sub}/*
              - Sid: UserLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Join
                  - ''
                  - - 'arn:aws:logs:'
                    - !Ref AWS::Region
                    - ':'
                    - !Ref AWS::AccountId
                    - ':log-group:'
                    # application composer bug
                    # - !Ref awsTutorialLogGroup
                    - !Ref ResourceNamePrefix
                    - _UserLogs
                    - ':log-stream:*'
      Tags:
        - Key: Usage
          Value: Youtube Streamer
  awsTutorialCognitoUnauthRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Join
        - ''
        - - !Ref ResourceNamePrefix
          - _Cognito_Unauth_Role
      Description: Role for AWS Cognito Identity Unauth
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action:
              - sts:AssumeRoleWithWebIdentity
              - sts:TagSession
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref awsTutorialCognitoIdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: unauthenticated
      Policies:
        - PolicyName: !Join
            - ''
            - - !Ref ResourceNamePrefix
              - _Cognito_Unauth_Policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DenyAll
                Effect: Deny
                Action: '*'
                Resource: '*'
      Tags:
        - Key: Usage
          Value: Youtube Streamer
  awsTutorialUserGeneratedContentS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref awsTutorialUserGeneratedContentS3Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowUserUpload
            Effect: Allow
            Principal:
              AWS: !GetAtt awsTutorialCognitoAuthRole.Arn
            Action:
              - s3:PutObject
            Resource: !Join
              - ''
              - - !GetAtt awsTutorialUserGeneratedContentS3Bucket.Arn
                - /${cognito-identity.amazonaws.com:sub}/*
          - Sid: AllowGet
            Effect: Allow
            Principal:
              AWS: !GetAtt awsTutorialCognitoAuthRole.Arn
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource: !Join
              - ''
              - - !GetAtt awsTutorialUserGeneratedContentS3Bucket.Arn
                - /${cognito-identity.amazonaws.com:sub}/*
          - Sid: AllowGetPublic
            Effect: Allow
            Principal:
              AWS: !GetAtt awsTutorialCognitoAuthRole.Arn
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource: !Join
              - ''
              - - !GetAtt awsTutorialUserGeneratedContentS3Bucket.Arn
                - /*
            Condition:
              StringEquals:
                s3:ExistingObjectTag/public: 'true'
          - Sid: AllowTag
            Effect: Allow
            Principal:
              AWS: !GetAtt awsTutorialCognitoAuthRole.Arn
            Action:
              - s3:PutObjectTagging
            Resource: !Join
              - ''
              - - !GetAtt awsTutorialUserGeneratedContentS3Bucket.Arn
                - /${cognito-identity.amazonaws.com:sub}/*
  awsTutorialCognitoIdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Join
        - ''
        - - !Ref ResourceNamePrefix
          - _Cognito_Identity_Pool
      AllowUnauthenticatedIdentities: true
      CognitoIdentityProviders:
        - ClientId: !Ref awsTutorialCognitoUserPoolClient
          ProviderName: !GetAtt awsTutorialCognitoUserPool.ProviderName
          ServerSideTokenCheck: true
  awsTutorialCognitoIdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref awsTutorialCognitoIdentityPool
      Roles:
        unauthenticated: !GetAtt awsTutorialCognitoUnauthRole.Arn
        authenticated: !GetAtt awsTutorialCognitoAuthRole.Arn
  awsTutorialCognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Join
        - ''
        - - !Ref ResourceNamePrefix
          - _Cognito_User_Pool
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      AliasAttributes:
        - email
        - preferred_username
      AutoVerifiedAttributes:
        - email
      DeletionProtection: INACTIVE
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      LambdaConfig:
        PreSignUp: !GetAtt awsTutorialPreSignUp.Arn
      MfaConfiguration: OPTIONAL
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
      Schema:
        - Name: avatar
          AttributeDataType: String
          Mutable: true
          Required: false
        - Name: weapon
          AttributeDataType: String
          Mutable: true
          Required: false
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email
      UsernameConfiguration:
        CaseSensitive: true
      UserPoolAddOns:
        AdvancedSecurityMode: 'OFF'
      UserPoolTags:
        Usage: Youtube Streamer
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
  awsTutorialUserPoolSteamIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      AttributeMapping:
        username: sub
        preferred_username: name
        custom:avatar: avatar
      ProviderName: Steam
      ProviderDetails:
        client_id: !Ref SteamAPPId
        client_secret: !Ref SteamAPIKey
        authorize_scopes: "openid"
        oidc_issuer: !Join
          - ''
          - - https://
            - !GetAtt awsTutorialSteamOAuthStack.Outputs.awsTutorialSteamOAuthDNSName
        attributes_request_method: "GET"
      ProviderType: OIDC
      UserPoolId: !Ref awsTutorialCognitoUserPool
  awsTutorialCognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Select
        - 2
        - !Split
          - '/'
          - !Ref AWS::StackId
      UserPoolId: !Ref awsTutorialCognitoUserPool
  awsTutorialCognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: awsTutorialUserPoolSteamIdentityProvider
    Properties:
      ClientName: !Join
        - ''
        - - !Ref ResourceNamePrefix
          - _Cognito_User_Pool_Client
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - profile
        - aws.cognito.signin.user.admin
      CallbackURLs:
        - !Join
          - ''
          - - https://
            - !GetAtt awsTutorialSteamOAuthStack.Outputs.awsTutorialSteamOAuthDNSName
            - /callback
      AuthSessionValidity: 3
      EnablePropagateAdditionalUserContextData: false
      EnableTokenRevocation: true
      ExplicitAuthFlows:
#       custom auth for steam
#        - ALLOW_CUSTOM_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: true
      PreventUserExistenceErrors: ENABLED
      SupportedIdentityProviders:
        - Steam
      ReadAttributes:
        - preferred_username
        - email
        - email_verified
        - custom:avatar
        - custom:weapon
      WriteAttributes:
        - email
        - preferred_username
        - custom:avatar
        - custom:weapon
      UserPoolId: !Ref awsTutorialCognitoUserPool
Metadata:
  AWS::Composer::Groups:
    Group1:
      Label: Cognito
      Members:
        - awsTutorialCognitoIdentityPool
        - awsTutorialCognitoUserPool
        - awsTutorialCognitoUserPoolClient
    Group2:
      Label: User Generated Content
      Members:
        - awsTutorialUserGeneratedContentS3Bucket
    Group3:
      Label: Logs
      Members:
        - awsTutorialLogGroup
Outputs:
  awsTutorialCognitoIdentityPoolId:
    Description: Cognito Identity Pool ID
    Value: !Ref awsTutorialCognitoIdentityPool
    Export:
      Name: !Sub awsTutorialCognitoIdentityPoolId
  awsTutorialCognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref awsTutorialCognitoUserPool
    Export:
      Name: !Sub awsTutorialCognitoUserPoolId
  awsTutorialCognitoUserPoolArn:
    Description: Cognito User Pool Arn
    Value: !GetAtt awsTutorialCognitoUserPool.Arn
    Export:
      Name: !Sub awsTutorialCognitoUserPoolArn
  awsTutorialCognitoUserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref awsTutorialCognitoUserPoolClient
    Export:
      Name: !Sub awsTutorialCognitoUserPoolClientId
  awsTutorialUserGeneratedContentS3Bucket:
    Description: User Generated Content S3 Bucket
    Value: !Ref awsTutorialUserGeneratedContentS3Bucket
    Export:
      Name: !Sub awsTutorialUserGeneratedContentS3Bucket
  awsTutorialLogGroupName:
    Description: Log Group Name
    Value: !Ref awsTutorialLogGroup
    Export:
      Name: !Sub awsTutorialLogGroupName
  awsTutorialUserPoolDomain:
    Description: User Pool Domain
    Value: !Join
      - ''
      - - !Select
          - 2
          - !Split
            - '/'
            - !Ref AWS::StackId
        - '.auth.ap-northeast-2.amazoncognito.com'
    Export:
      Name: !Sub awsTutorialUserPoolDomain
  awsTutorialSteamOAuthEC2InstanceIpAddress:
    Description: The ip address of the Steam OAuth Server, add it to Whitelisted IPs of steam web api key management
    Value: !GetAtt awsTutorialSteamOAuthStack.Outputs.SteamOAuthEC2InstanceIpAddress
    Export:
      Name: !Sub awsTutorialSteamOAuthEC2InstanceIpAddress
  awsTutorialSteamOAuthHost:
    Description: The DNSName of the Steam OAuth Server
    Value: !GetAtt awsTutorialSteamOAuthStack.Outputs.awsTutorialSteamOAuthDNSName
    Export:
      Name: !Sub awsTutorialSteamOAuthHost