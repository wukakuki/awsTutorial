Parameters:
    ResourceNamePrefix:
        Description: Prefix of resource name
        Default: awstutorial
        Type: String
    SteamOAuthEC2InstanceType:
        Description: ec2 instance type of the steam oauth server
        Type: String
        Default: t4g.nano
    SteamAPIKey:
        Description: Steam API Key for authentication
        Type: String
    SteamAPPId:
        Description: Steam App ID for authentication
        Type: String
    SteamIdentity:
        Description: Steam Identity for authentication
        Type: String
        Default: 'awsTutorial'
    AuthCodeValidity:
        Description: auth code validity in seconds
        Type: Number
        Default: 300
    DefaultTokenValidity:
        Description: default token validity in seconds
        Type: Number
        Default: 3600
    AccessTokenValidity:
        Description: access token validity in seconds
        Type: Number
        Default: 3600
    RefreshTokenValidity:
        Description: refresh token validity in seconds
        Type: Number
        Default: 2592000
    IdTokenValidity:
        Description: id token validity in seconds
        Type: Number
        Default: 3600
Resources:
    awsTutorialSteamOAuthEC2VPC:
        Type: AWS::EC2::VPC
        Properties:
            CidrBlock: 10.0.0.0/16
            EnableDnsHostnames: true
            EnableDnsSupport: true
            InstanceTenancy: default
            Tags:
                -   Key: Usage
                    Value: Youtube Streamer
    awsTutorialSteamOAuthEC2Subnet:
        Type: AWS::EC2::Subnet
        Properties:
            CidrBlock: 10.0.1.0/24
            MapPublicIpOnLaunch: false
            VpcId: !Ref awsTutorialSteamOAuthEC2VPC
            Tags:
                -   Key: Usage
                    Value: Youtube Streamer
    awsTutorialSteamOAuthEC2InternetGateway:
        Type: AWS::EC2::InternetGateway
        Properties:
            Tags:
                -   Key: Usage
                    Value: Youtube Streamer
    awsTutorialSteamOAuthEC2VPCGatewayAttachment:
        Type: AWS::EC2::VPCGatewayAttachment
        Properties:
            InternetGatewayId: !Ref awsTutorialSteamOAuthEC2InternetGateway
            VpcId: !Ref awsTutorialSteamOAuthEC2VPC
    awsTutorialSteamOAuthEC2RouteTable:
        Type: AWS::EC2::RouteTable
        Properties:
            VpcId: !Ref awsTutorialSteamOAuthEC2VPC
            Tags:
                -   Key: Usage
                    Value: Youtube Streamer
    awsTutorialSteamOAuthEC2Route:
        Type: AWS::EC2::Route
        Properties:
            DestinationCidrBlock: 0.0.0.0/0
            GatewayId: !Ref awsTutorialSteamOAuthEC2InternetGateway
            RouteTableId: !Ref awsTutorialSteamOAuthEC2RouteTable
    awsTutorialSteamOAuthEC2SubnetRouteTableAssociation:
        Type: AWS::EC2::SubnetRouteTableAssociation
        Properties:
            RouteTableId: !Ref awsTutorialSteamOAuthEC2RouteTable
            SubnetId: !Ref awsTutorialSteamOAuthEC2Subnet
    awsTutorialSteamOAuthEC2InstanceSecurityGroup:
        Type: AWS::EC2::SecurityGroup
        Properties:
            GroupName: !Join
                - ''
                -   - !Ref ResourceNamePrefix
                    - _Steam_OAuth_EC2_Instance_SG
            GroupDescription: Security Group for Steam OAuth Server
            VpcId: !Ref awsTutorialSteamOAuthEC2VPC
            Tags:
                -   Key: Usage
                    Value: Youtube Streamer
    awsTutorialSteamOAuthEC2InstanceSecurityGroupIngressFromELB:
        Type: AWS::EC2::SecurityGroupIngress
        Properties:
            Description: Ingress from ELB
            GroupId: !Ref awsTutorialSteamOAuthEC2InstanceSecurityGroup
            IpProtocol: tcp
            FromPort: 8000
            ToPort: 8000
            SourceSecurityGroupId: !Ref awsTutorialSteamOAuthELBSecurityGroup
    awsTutorialSteamOAuthRole:
        Type: AWS::IAM::Role
        Properties:
            RoleName: !Join
                - ''
                -   - !Ref ResourceNamePrefix
                    - _Steam_OAuth_IAM_Role
            Description: Role for ws mmo
            AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                    -   Effect: Allow
                        Principal:
                            Service:
                                - ec2.amazonaws.com
                        Action:
                            - sts:AssumeRole
            ManagedPolicyArns:
                - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
            Tags:
                -   Key: Usage
                    Value: Youtube Streamer
    awsTutorialSteamOAuthIAMInstanceProfile:
        Type: AWS::IAM::InstanceProfile
        Properties:
            InstanceProfileName: !Join
                - ''
                -   - !Ref ResourceNamePrefix
                    - _Steam_OAuth_IAM_InstanceProfile
            Path: '/'
            Roles:
                - !Ref awsTutorialSteamOAuthRole
    awsTutorialSteamOAuthEC2LaunchTemplate:
        Type: AWS::EC2::LaunchTemplate
        Properties:
            LaunchTemplateName: !Join
                - ''
                -   - !Ref ResourceNamePrefix
                    - _Steam_OAuth_EC2_LaunchTemplate
            LaunchTemplateData:
                #        InstanceMarketOptions:
                #          MarketType: capacity-block
                #          SpotOptions:
                #            InstanceInterruptionBehavior: stop
                #            SpotInstanceType: persistent
                InstanceType: !Ref SteamOAuthEC2InstanceType
                IamInstanceProfile:
                    Arn: !GetAtt awsTutorialSteamOAuthIAMInstanceProfile.Arn
                ImageId: !FindInMap
                    - AMIRegionMappings
                    - !Ref AWS::Region
                    - AMI
                #        {
                #          "steam_app_id": "",
                #          "steam_web_api_key": "",
                #          "steam_identity": "awsTutorial",
                #          "auth_code_validity": 300,
                #          "default_token_validity": 3600,
                #          "access_token_validity": 3600,
                #          "refresh_token_validity": 2592000,
                #          "id_token_validity": 3600,
                #        }
                UserData: !Base64
                    Fn::Sub: |
                        {
                          "steam_app_id": "${SteamAPPId}",
                          "steam_web_api_key": "${SteamAPIKey}",
                          "steam_identity": "${SteamIdentity}",
                          "auth_code_validity": ${AuthCodeValidity},
                          "default_token_validity": ${DefaultTokenValidity},
                          "access_token_validity": ${AccessTokenValidity},
                          "refresh_token_validity": ${RefreshTokenValidity},
                          "id_token_validity": ${IdTokenValidity}
                        }
                TagSpecifications:
                    -   ResourceType: instance
                        Tags:
                            -   Key: Usage
                                Value: Youtube Streamer
                    -   ResourceType: volume
                        Tags:
                            -   Key: Usage
                                Value: Youtube Streamer
                    -   ResourceType: network-interface
                        Tags:
                            -   Key: Usage
                                Value: Youtube Streamer
    #          - ResourceType: spot-instances-request
    #            Tags:
    #              - Key: Usage
    #                Value: Youtube Streamer
    awsTutorialSteamOAuthEC2Instance:
        Type: AWS::EC2::Instance
        Properties:
            LaunchTemplate:
                LaunchTemplateId: !Ref awsTutorialSteamOAuthEC2LaunchTemplate
                Version: !GetAtt awsTutorialSteamOAuthEC2LaunchTemplate.DefaultVersionNumber
            NetworkInterfaces:
                -   AssociatePublicIpAddress: true
                    DeleteOnTermination: true
                    DeviceIndex: '0'
                    GroupSet:
                        - !Ref awsTutorialSteamOAuthEC2InstanceSecurityGroup
                    SubnetId: !Ref awsTutorialSteamOAuthEC2Subnet
            Tags:
                -   Key: Usage
                    Value: Youtube Streamer
