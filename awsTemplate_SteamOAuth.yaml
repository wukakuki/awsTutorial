    awsTutorialSteamOAuthELB:
        Type: AWS::ElasticLoadBalancingV2::LoadBalancer
        Properties:
            Name: !Join
                - ''
                -   - !Ref ResourceNamePrefix
                    - '-Steam-OAuth-ELB'
            Type: network
            Scheme: internet-facing
            Subnets:
                - !Ref awsTutorialSteamOAuthEC2Subnet
            SecurityGroups:
                - !Ref awsTutorialSteamOAuthELBSecurityGroup
            Tags:
                -   Key: Usage
                    Value: Youtube Streamer
    awsTutorialSteamOAuthELBTargetGroup:
        Type: AWS::ElasticLoadBalancingV2::TargetGroup
        Properties:
            Name: !Join
                - ''
                -   - !Ref ResourceNamePrefix
                    - '-Steam-OAuth-ELB-TG'
            HealthCheckPath: /health
            HealthCheckPort: 8000
            HealthCheckProtocol: HTTP
            Protocol: TCP
            Port: 8000
            VpcId: !Ref awsTutorialSteamOAuthEC2VPC
            TargetType: instance
            Targets:
                -   Id: !Ref awsTutorialSteamOAuthEC2Instance
            Tags:
                -   Key: Usage
                    Value: Youtube Streamer
    awsTutorialSteamOAuthELBListener:
        Type: AWS::ElasticLoadBalancingV2::Listener
        Properties:
            LoadBalancerArn: !Ref awsTutorialSteamOAuthELB
            Protocol: TCP
            Port: 80
            DefaultActions:
                -   Type: forward
                    TargetGroupArn: !Ref awsTutorialSteamOAuthELBTargetGroup
    awsTutorialSteamOAuthCloudFrontDistribution:
        Type: AWS::CloudFront::Distribution
        Properties:
            DistributionConfig:
                DefaultCacheBehavior:
                    TargetOriginId: !Join
                        - ''
                        -   - !Ref ResourceNamePrefix
                            - _Steam_OAuth_CLoudFront_Distribution_ELB_Origin
                    AllowedMethods:
                        - GET
                        - HEAD
                        - POST
                        #            belows for AllowedMethods must be [HEAD, GET] or [HEAD, GET, OPTIONS] or [HEAD, DELETE, POST, GET, OPTIONS, PUT, PATCH]
                        - OPTIONS
                        - PUT
                        - PATCH
                        - DELETE
                    CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # caching disabled
                    ForwardedValues:
                        Headers:
                            - Authorization
                        QueryString: true
                    OriginRequestPolicyId: 33f36d7e-f396-46d9-90e0-52428a34d9dc # all viewer and cloud front headers
                    ViewerProtocolPolicy: redirect-to-https
                Enabled: true
                HttpVersion: http2and3
                Origins:
                    -   Id: !Join
                            - ''
                            -   - !Ref ResourceNamePrefix
                                - _Steam_OAuth_CLoudFront_Distribution_ELB_Origin
                        DomainName: !GetAtt awsTutorialSteamOAuthELB.DNSName
                        CustomOriginConfig:
                            HTTPPort: 80
                            OriginProtocolPolicy: http-only
                ViewerCertificate:
                    CloudFrontDefaultCertificate: true
            Tags:
                -   Key: Usage
                    Value: Youtube Streamer
Outputs:
    awsTutorialSteamOAuthDNSName:
        Description: The DNSName of the Steam OAuth Server
        Value: !GetAtt awsTutorialSteamOAuthCloudFrontDistribution.DomainName
        Export:
            Name: !Sub awsTutorialSteamOAuthDNSName
    SteamOAuthEC2InstanceIpAddress:
        Description: The ip address of the Steam OAuth Server, add it to Whitelisted IPs of steam web api key management
        Value: !GetAtt awsTutorialSteamOAuthEC2Instance.PublicIp
        Export:
            Name: !Sub SteamOAuthEC2InstanceIpAddress